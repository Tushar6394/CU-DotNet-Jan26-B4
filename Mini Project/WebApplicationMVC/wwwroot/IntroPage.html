<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro Page</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f5f7fa, #d7e1ec);
        font-family: Georgia, "Times New Roman", serif;
      }

      .intro-card {
        max-width: 720px;
        padding: 3rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 50px rgba(31, 41, 55, 0.15);
        text-align: center;
      }

      h1 {
        margin-bottom: 1rem;
        color: #153243;
      }

      p {
        margin: 0;
        color: #334e68;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main class="intro-card">
      <h1>Welcome to my MVC Application</h1>
    </main>
  </body>
</html>
