<!doctype html>
<html>
  <head>
    <title>Loan Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f0f0;
        padding: 30px;
      }

      h2 {
        text-align: center;
      }

      .form-area {
        background: white;
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .form-area input,
      .form-area select {
        width: 100%;
        padding: 8px;
        margin: 8px 0 14px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
      }

      .form-area label {
        font-size: 14px;
        font-weight: bold;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover {
        background: #3e8e41;
      }

      .summary {
        max-width: 500px;
        margin: 10px auto;
        padding: 12px;
        background: #e8f5e9;
        border-left: 4px solid #4caf50;
        border-radius: 4px;
        font-size: 14px;
        display: none;
      }

      table {
        width: 100%;
        max-width: 800px;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
        font-size: 14px;
      }

      th,
      td {
        padding: 9px 12px;
        border: 1px solid #ddd;
        text-align: center;
      }

      th {
        background: #4caf50;
        color: white;
      }

      tr:nth-child(even) {
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h2>Loan EMI Calculator</h2>

    <div class="form-area">
      <label>Loan Amount (₹)</label>
      <input type="number" id="amount" placeholder="e.g. 500000" />

      <label>Annual Interest Rate (%)</label>
      <input type="number" id="rate" placeholder="e.g. 8.5" />

      <label>Tenure (Months)</label>
      <input type="number" id="months" placeholder="e.g. 24" />

      <label>Loan Type</label>
      <select id="loanType">
        <option value="Home Loan">Home Loan</option>
        <option value="Car Loan">Car Loan</option>
        <option value="Personal Loan">Personal Loan</option>
        <option value="Education Loan">Education Loan</option>
        <option value="Business Loan">Business Loan</option>
        <option value="Other">Other</option>
      </select>

      <button onclick="calculate()">Calculate EMI</button>
    </div>

    <div class="summary" id="summary"></div>

    <table id="resultTable" style="display: none">
      <thead>
        <tr>
          <th>#</th>
          <th>Opening Balance</th>
          <th>EMI</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Closing Balance</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <script>
      function calculate() {
        var amount = parseFloat(document.getElementById("amount").value);
        var rate = parseFloat(document.getElementById("rate").value);
        var months = parseInt(document.getElementById("months").value);
        var loanType = document.getElementById("loanType").value;

        if (!amount || !rate || !months) {
          alert("Please fill in all fields.");
          return;
        }

        var monthlyRate = rate / 100 / 12;
        var emi =
          (amount * monthlyRate * Math.pow(1 + monthlyRate, months)) /
          (Math.pow(1 + monthlyRate, months) - 1);

        var balance = amount;
        var tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";

        for (var i = 1; i <= months; i++) {
          var interest = balance * monthlyRate;
          var principal = emi - interest;
          var closing = balance - principal;

          tbody.innerHTML +=
            "<tr>" +
            "<td>" +
            i +
            "</td>" +
            "<td>₹" +
            balance.toFixed(2) +
            "</td>" +
            "<td>₹" +
            emi.toFixed(2) +
            "</td>" +
            "<td>₹" +
            principal.toFixed(2) +
            "</td>" +
            "<td>₹" +
            interest.toFixed(2) +
            "</td>" +
            "<td>₹" +
            (closing < 0 ? "0.00" : closing.toFixed(2)) +
            "</td>" +
            "</tr>";

          balance = closing;
        }

        document.getElementById("summary").style.display = "block";
        document.getElementById("summary").innerHTML =
          "<strong>Loan Type:</strong> " +
          loanType +
          " &nbsp;|&nbsp; <strong>Amount:</strong> ₹" +
          amount.toFixed(2) +
          " &nbsp;|&nbsp; <strong>Monthly EMI:</strong> ₹" +
          emi.toFixed(2) +
          " &nbsp;|&nbsp; <strong>Tenure:</strong> " +
          months +
          " months";

        document.getElementById("resultTable").style.display = "table";
      }
    </script>
  </body>
</html>
