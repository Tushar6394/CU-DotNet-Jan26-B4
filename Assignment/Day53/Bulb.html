<!doctype html>
<html>
  <head>
    <title>Bulb ON OFF</title>
    <style>
      body {
        text-align: center;
        font-family: Arial;
        margin-top: 50px;
      }
      img {
        width: 200px;
      }
      button {
        padding: 10px 20px;
        margin: 10px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Bulb ON / OFF</h2>
    <img id="bulb" src="https://www.w3schools.com/js/pic_bulboff.gif" />
    <br /><br />
    <button onclick="turnOn()">ON</button>
    <button onclick="turnOff()">OFF</button>
    <script>
      function turnOn() {
        document.getElementById("bulb").src =
          "https://www.w3schools.com/js/pic_bulbon.gif";
      }
      function turnOff() {
        document.getElementById("bulb").src =
          "https://www.w3schools.com/js/pic_bulboff.gif";
      }
    </script>
  </body>
</html>
